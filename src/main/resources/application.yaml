spring:
  application:
    name: dram
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/dram
    username: ${DB_USERNAME:dram}
    password: ${DB_PASSWORD:dram}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o-mini

logging:
  level:
    org.hibernate.SQL: debug
